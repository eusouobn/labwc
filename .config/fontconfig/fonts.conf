<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Famílias genéricas → Ubuntu (bold) -->

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Ubuntu Mono</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Ubuntu Mono</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>fixed</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Ubuntu Mono</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Ubuntu</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Ubuntu</string></edit>
  </match>
</fontconfig>
